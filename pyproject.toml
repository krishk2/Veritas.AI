[project]
name = "veritas-ai"
version = "0.1.0"
description = "Veritas.AI: Multi-agent verification intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.110.0",
    "google-generativeai>=0.8.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tavily-python>=0.3.0",
    "uvicorn>=0.30.0",
    "sqlmodel>=0.0.18",
    "neo4j>=5.19.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=5.0.0.93",
    "langfuse>=5.2.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "duckduckgo-search>=8.1.1",
    "langchain-groq>=1.2.0",
    "groq>=1.7.0",
    "langchain-openai>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
veritas-api = "veritas.api:main"
veritas-cli = "veritas.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
